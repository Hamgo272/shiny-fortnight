apply plugin: 'com.android.library'

android {
    namespace "com.brenpoly.cardboardxr.windows"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// This plugin uses only public Android intents. No Shizuku or shell service.
